name: daily-log

on:
  schedule:
    - cron: "0 18 * * *"  # 23:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write today's entry
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: |
          echo "token length: ${#ACTIVITY_TOKEN}"
          python bot/devlog.py
      - name: Commit
        run: |
          git config user.name "Divyansh Joshi"
          git config user.email "184637540+divyanshjoshii@users.noreply.github.com"
          git add log
          git diff --cached --quiet || git commit -m "log: $(date -u +%F)"
          git push
