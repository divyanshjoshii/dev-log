name: daily-log

on:
  schedule:
    - cron: "0 18 * * *"  # 23:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write today's entry
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: |
          python bot/devlog.py
      - name: Build chat context
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: python bot/context.py
      - name: Commit
        run: |
          git config user.name "Divyansh Joshi"
          git config user.email "184637540+divyanshjoshii@users.noreply.github.com"
          git add log context.md
          git diff --cached --quiet || git commit -m "log: $(date -u +%F)"
          git push
      - name: Telegram ping
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/notify.py daily
      - name: Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python bot/notify.py failure
